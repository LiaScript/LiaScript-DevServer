<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The shell: no inline scripts, no connections but to this server.
      The messages are LiaScript, rendered by @liascript/chat in an iframe of
      this origin that this policy does not cover: like a course it runs the
      scripts of a message, loads templates and images from anywhere and can
      reach this page. So a message of the AI is as trusted as the course.
      The course in the other iframe has its own policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>LiaScript</title>
    <link rel="stylesheet" href="chat.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        color-scheme: light dark;
        font: 15px/1.45 system-ui, sans-serif;
      }
      #course {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #chat {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 1;
        background: Canvas;
        color: CanvasText;
        border: 1px solid GrayText;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgb(0 0 0 / 0.3);
      }
      /* the button moves the chat: dragged it does not toggle */
      #chat > summary {
        padding: 0.5rem 0.9rem;
        font-weight: 600;
        cursor: pointer;
        touch-action: none;
        user-select: none;
      }
      #chat[open] > summary {
        cursor: move;
      }
      /* the free corner, the chat is anchored at the bottom right */
      #grip {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 14px;
        height: 14px;
        cursor: nwse-resize;
        touch-action: none;
        border-top: 3px solid GrayText;
        border-left: 3px solid GrayText;
        border-top-left-radius: 12px;
      }
      #chat[open] > #grip {
        display: block;
      }
      /* Docked: a column at the right edge, the course gets the rest and the
         grip becomes the border between them. chat.js sets --dock, the width
         of the column, and --head, the height of the button. */
      body.docked #course {
        width: calc(100% - var(--dock));
      }
      body.docked #chat {
        top: 0;
        right: 0 !important;
        bottom: 0 !important;
        width: var(--dock);
        box-sizing: border-box;
        border-width: 0 0 0 1px;
        border-radius: 0;
        box-shadow: none;
      }
      body.docked #chat > summary {
        cursor: pointer;
      }
      body.docked #panel {
        width: auto !important;
        height: calc(100vh - var(--head, 2.5rem)) !important;
        box-sizing: border-box;
        min-width: 0;
        max-width: none;
        max-height: none;
      }
      body.docked #chat > #grip {
        top: 0;
        bottom: 0;
        left: -4px;
        width: 8px;
        height: auto;
        border: 0;
        border-radius: 0;
        cursor: ew-resize;
      }
      body.docked #grip:hover,
      body.docked.dragging #grip {
        background: color-mix(in srgb, Highlight 50%, transparent);
      }
      /* the course must not swallow the pointer while the chat moves */
      body.dragging #course {
        pointer-events: none;
      }
      body.dragging {
        user-select: none;
      }
      #panel {
        display: flex;
        flex-direction: column;
        width: min(26rem, calc(100vw - 2rem - 2px));
        height: min(34rem, calc(100vh - 5rem));
        min-width: 16rem;
        min-height: 14rem;
        /* a size from a bigger window must not push the chat off screen */
        max-width: calc(100vw - 2px);
        max-height: calc(100vh - 3rem);
        border-top: 1px solid GrayText;
      }
      /* which chat, and which agent of a workflow */
      #bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.75rem;
        border-bottom: 1px solid GrayText;
      }
      #bar select {
        flex: 1;
        /* the robots and the box wrap to the next line before it gets narrower */
        min-width: 9rem;
        font: inherit;
        padding: 0.2rem 0.3rem;
        border-radius: 6px;
      }
      #bar [hidden] {
        display: none !important;
      }
      /* the agents of a workflow, a click hands the chat over */
      #agents {
        display: flex;
        gap: 0.25rem;
      }
      #agents button {
        padding: 2px;
        border: 2px solid transparent;
        border-radius: 7px;
        background: none;
        line-height: 0;
      }
      #agents button[aria-checked='true'] {
        border-color: Highlight;
      }
      #agents.failed {
        outline: 2px solid red;
      }
      #autoread-box {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.85em;
        white-space: nowrap;
        cursor: pointer;
      }
      #mute,
      #dock {
        padding: 0 0.4rem;
        border: 0;
        background: none;
      }
      #dock {
        font-size: 1.3em;
        line-height: 1;
      }
      #dock[aria-pressed='true'] {
        color: Highlight;
      }
      #mute-info {
        margin: 0;
        padding: 0.4rem 0.75rem;
        font-size: 0.85em;
        border-bottom: 1px solid GrayText;
      }
      /* the messages: @liascript/chat in an iframe of its own (chat.js) */
      #log {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      #log > lia-chat {
        flex: 1;
        min-width: 0;
      }
      #who {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      /* the robot of the agent below the log, it reads the messages aloud */
      #stage {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.4rem 0.75rem;
        border-top: 1px solid color-mix(in srgb, GrayText 40%, transparent);
      }
      #stage .lines {
        flex: 1;
        min-width: 0;
      }
      #status {
        font-size: 0.9em;
        color: GrayText;
      }
      #hint {
        margin-top: 0.3rem;
        padding-left: 0.5rem;
        border-left: 3px solid GrayText;
        font-size: 0.85em;
      }
      button {
        font: inherit;
        padding: 0.35rem 0.8rem;
        border-radius: 8px;
        border: 1px solid GrayText;
        cursor: pointer;
      }
      #say {
        display: flex;
        gap: 0.5rem;
        padding: 0.6rem;
        border-top: 1px solid GrayText;
      }
      #say textarea {
        flex: 1;
        font: inherit;
        resize: none;
        border-radius: 8px;
        padding: 0.4rem 0.5rem;
      }
    </style>
  </head>
  <body>
    <iframe id="course" title="LiaScript course" data-t-title="LiaScript course"></iframe>

    <details id="chat" open>
      <summary id="who">Chat</summary>
      <div id="grip" title="Resize" data-t-title="Resize" aria-hidden="true"></div>
      <div id="panel">
        <div id="bar">
          <select id="sessions" aria-label="Chat"></select>
          <div id="agents" role="radiogroup" aria-label="Agent" data-t-aria-label="Agent" hidden></div>
          <label id="autoread-box" hidden>
            <input id="autoread" type="checkbox" />
            <span data-t="Read everything aloud">Read everything aloud</span>
          </label>
          <button
            id="mute"
            type="button"
            title="Cannot read aloud"
            data-t-title="Cannot read aloud"
            data-t-aria-label="Cannot read aloud"
            hidden
          >
            🔇
          </button>
          <button id="dock" type="button" aria-pressed="false" hidden>◨</button>
        </div>
        <p
          id="mute-info"
          data-t="This browser cannot read aloud, it has no speech voices. Chrome and Edge bring their own, Firefox on Linux needs speech-dispatcher with a voice. The assistant can help to set it up."
          hidden
        ></p>
        <div id="log" role="log" aria-live="polite"></div>
        <div id="stage">
          <span id="bot"></span>
          <div class="lines">
            <div id="status" role="status" hidden></div>
            <div id="hint" role="status" hidden></div>
          </div>
        </div>
        <form id="say">
          <textarea
            name="text"
            rows="2"
            required
            aria-label="Message to the AI"
            data-t-aria-label="Message to the AI"
            placeholder="Ask the AI about this course …"
            data-t-placeholder="Ask the AI about this course …"
          ></textarea>
          <button data-t="Send">Send</button>
        </form>
      </div>
    </details>

    <!-- the messages: LiaScript, served from node_modules/@liascript/chat -->
    <script src="lia-chat/element.js"></script>
    <script src="avatar.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
