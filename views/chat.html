<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The shell: no inline scripts, no connections but to this server.
      The messages are LiaScript, rendered by @liascript/chat in an iframe of
      this origin that this policy does not cover: like a course it runs the
      scripts of a message, loads templates and images from anywhere and can
      reach this page. So a message of the AI is as trusted as the course.
      The course in the other iframe has its own policy, a web page there
      comes from the proxy, another origin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self' http: https:; base-uri 'none'; form-action 'none'"
    />
    <title>LiaScript</title>
    <script src="nested.js"></script>
    <link rel="stylesheet" href="chat.css" />
    <style>
      /* LiaScript's colors: --hl is the --color-highlight of the course
         (chat.js), the rest follows LiaScript's mode */
      :root {
        --hl: 20, 115, 117;
        --hl-light: color-mix(in srgb, rgb(var(--hl)) 72%, white);
        --accent: rgb(var(--hl));
        --surface: 255, 255, 255;
        --text: #3d4142;
        --muted: #7c8486;
        --line: rgb(0 0 0 / 0.09);
        --soft: rgb(0 0 0 / 0.05);
        --live: #3fb950;
      }
      .lia-variant-dark {
        --surface: 28, 32, 34;
        --text: #e6e8e8;
        --muted: #8d9698;
        --line: rgb(255 255 255 / 0.1);
        --soft: rgb(255 255 255 / 0.07);
        --accent: var(--hl-light);
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        /* LiaScript's mode, not the system's: chat.js sets the class */
        color-scheme: light;
        font: 15px/1.45 lia-sans, system-ui, sans-serif;
      }
      .lia-variant-dark body {
        color-scheme: dark;
      }
      #course {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* floating it is glass over the course */
      #chat {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 1;
        background: rgba(var(--surface), 0.72);
        -webkit-backdrop-filter: blur(18px) saturate(1.5);
        backdrop-filter: blur(18px) saturate(1.5);
        color: var(--text);
        border: 1px solid rgb(255 255 255 / 0.55);
        border-radius: 18px;
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.6),
          0 18px 48px -12px rgba(var(--hl), 0.45),
          0 4px 14px rgb(0 0 0 / 0.08);
      }
      .lia-variant-dark #chat {
        border-color: rgb(255 255 255 / 0.12);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.08),
          0 18px 48px -12px rgba(var(--hl), 0.4),
          0 4px 14px rgb(0 0 0 / 0.3);
      }
      /* the button moves the chat: dragged it does not toggle */
      #chat > summary {
        padding: 0.5rem 0.8rem;
        font-weight: 600;
        cursor: pointer;
        touch-action: none;
        user-select: none;
        list-style: none;
      }
      #chat > summary::-webkit-details-marker {
        display: none;
      }
      #chat > summary::after {
        content: '\ea15';
        font-family: lia-icon;
        font-weight: normal;
        font-size: 0.7em;
        color: var(--muted);
        transform: rotate(180deg);
      }
      #chat[open] > summary::after {
        transform: none;
      }
      #chat[open] > summary {
        cursor: move;
      }
      /* the free corner, the chat is anchored at the bottom right */
      #grip {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 14px;
        height: 14px;
        cursor: nwse-resize;
        touch-action: none;
        border-top: 3px solid rgba(var(--hl), 0.45);
        border-left: 3px solid rgba(var(--hl), 0.45);
        border-top-left-radius: 18px;
      }
      #chat[open] > #grip {
        display: block;
      }
      /* Docked: a column at the right edge, the course gets the rest and the
         grip becomes the border between them. chat.js sets --dock, the width
         of the column, and --head, the height of the button. Nothing lies
         behind it, so no glass. */
      body.docked #course {
        width: calc(100% - var(--dock));
      }
      body.docked #chat {
        top: 0;
        right: 0 !important;
        bottom: 0 !important;
        width: var(--dock);
        box-sizing: border-box;
        background: rgb(var(--surface));
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        border-width: 0 0 0 1px;
        border-color: var(--line);
        border-radius: 0;
        box-shadow: none;
      }
      body.docked #chat > summary {
        cursor: pointer;
      }
      body.docked #panel {
        width: auto !important;
        height: calc(100vh - var(--head, 2.5rem)) !important;
        box-sizing: border-box;
        min-width: 0;
        max-width: none;
        max-height: none;
      }
      body.docked #chat > #grip {
        top: 0;
        bottom: 0;
        left: -4px;
        width: 8px;
        height: auto;
        border: 0;
        border-radius: 0;
        cursor: ew-resize;
      }
      body.docked #grip:hover,
      body.docked.dragging #grip {
        background: rgba(var(--hl), 0.5);
      }
      /* the course must not swallow the pointer while the chat moves */
      body.dragging #course {
        pointer-events: none;
      }
      body.dragging {
        user-select: none;
      }
      #panel {
        display: flex;
        flex-direction: column;
        width: min(26rem, calc(100vw - 2rem - 2px));
        height: min(34rem, calc(100vh - 5rem));
        min-width: 16rem;
        min-height: 14rem;
        /* a size from a bigger window must not push the chat off screen */
        max-width: calc(100vw - 2px);
        max-height: calc(100vh - 3rem);
        border-top: 1px solid var(--line);
      }
      /* which chat, and which agent of a workflow */
      #bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.15rem;
        padding: 0.35rem 0.5rem;
        border-bottom: 1px solid var(--line);
      }
      #bar select {
        flex: 1;
        /* the robots and the box wrap to the next line before it gets narrower */
        min-width: 9rem;
        margin-right: 0.25rem;
        font: inherit;
        font-size: 0.9em;
        padding: 0.3rem 0.5rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(var(--surface), 0.6);
        color: inherit;
      }
      #bar [hidden] {
        display: none !important;
      }
      /* the agents of a workflow, a click hands the chat over; the green dot
         marks the one the user talks to */
      #agents {
        display: flex;
        gap: 0.25rem;
        margin-right: 0.25rem;
      }
      #agents button {
        position: relative;
        padding: 2px;
        border: 0;
        border-radius: 8px;
        background: none;
        line-height: 0;
      }
      #agents button:hover {
        background: var(--soft);
      }
      .face {
        position: relative;
        display: inline-flex;
      }
      #agents button[aria-checked='true']::after,
      .face.live::after {
        content: '';
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--live);
        box-shadow:
          0 0 0 2px rgb(var(--surface)),
          0 0 6px var(--live);
      }
      #agents.failed {
        outline: 2px solid red;
      }
      /* the buttons of the bar: icons only, the text is the tooltip */
      .tool {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--muted);
        font-size: 16px;
        cursor: pointer;
      }
      .tool:hover,
      .tool:focus-visible {
        background: var(--soft);
        color: var(--accent);
      }
      .tool svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #dock[aria-pressed='true'] {
        color: var(--accent);
      }
      #mute {
        opacity: 0.6;
      }
      /* read everything aloud: the box is invisible, the speaker shows it */
      #autoread {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: 0;
        opacity: 0;
      }
      /* not the muted speaker of #mute when off: it read as cannot read aloud */
      #autoread + .icon::before {
        content: '\ea59';
        opacity: 0.6;
      }
      #autoread:checked + .icon::before {
        opacity: 1;
      }
      #autoread-box:has(:checked) {
        color: var(--accent);
      }
      #autoread-box:has(:focus-visible) {
        outline: 2px solid var(--accent);
      }
      #address:not([hidden]) {
        display: flex;
        padding: 0.4rem 0.75rem;
        border-bottom: 1px solid var(--line);
      }
      #address input {
        flex: 1;
        font: inherit;
        padding: 0.3rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(var(--surface), 0.85);
        color: inherit;
      }
      #phone[aria-pressed='true'] {
        color: var(--accent);
      }
      /* the 📱 of the bar: link and QR code for a phone (--share) */
      #share:not([hidden]) {
        display: flex;
        gap: 0.75rem;
        align-items: flex-start;
        padding: 0.5rem 0.75rem;
        font-size: 0.85em;
        border-bottom: 1px solid var(--line);
      }
      #share-qr {
        flex: none;
        width: 132px;
        line-height: 0;
      }
      #share-qr:empty {
        display: none;
      }
      #share-qr svg {
        width: 100%;
        height: auto;
        border-radius: 6px;
      }
      #share p {
        margin: 0 0 0.4rem;
      }
      #share-error {
        color: #c62828;
      }
      .share-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }
      .share-actions button {
        font: inherit;
        padding: 0.2rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: none;
        color: inherit;
        cursor: pointer;
      }
      .share-actions button:hover,
      .share-actions button:focus-visible {
        background: var(--soft);
        color: var(--accent);
      }
      .share-note {
        color: var(--muted);
      }
      #mute-info {
        margin: 0;
        padding: 0.4rem 0.75rem;
        font-size: 0.85em;
        border-bottom: 1px solid var(--line);
      }
      /* the messages: @liascript/chat in an iframe of its own (chat.js) */
      #log {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      #log > lia-chat {
        flex: 1;
        min-width: 0;
      }
      #who {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      /* the robot of the agent below the log, it reads the messages aloud */
      #stage {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.4rem 0.75rem;
        border-top: 1px solid var(--line);
      }
      #stage .lines {
        flex: 1;
        min-width: 0;
      }
      #status {
        font-size: 0.9em;
        color: var(--muted);
      }
      /* the progress line shimmers while the agent works */
      @media (prefers-reduced-motion: no-preference) {
        #status:not([hidden]) {
          background: linear-gradient(90deg, var(--muted) 30%, var(--hl-light) 50%, var(--muted) 70%) 0 0 / 250% 100%;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          animation: shimmer 2s linear infinite;
        }
      }
      @keyframes shimmer {
        to {
          background-position: -250% 0;
        }
      }
      /* how long the agent works already, after 20 s (chat.js) */
      #status::after {
        content: attr(data-since);
      }
      /* the way to the open form or to new messages out of sight */
      #jump {
        flex: none;
        padding: 0.2rem 0.7rem;
        border-radius: 999px;
        border-color: transparent;
        background: rgb(var(--hl));
        color: #fff;
        font-size: 0.85em;
        white-space: nowrap;
      }
      #hint {
        margin-top: 0.3rem;
        padding-left: 0.5rem;
        border-left: 3px solid rgba(var(--hl), 0.5);
        font-size: 0.85em;
      }
      button {
        font: inherit;
        padding: 0.35rem 0.8rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(var(--surface), 0.7);
        color: inherit;
        cursor: pointer;
      }
      #say {
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
        padding: 0.6rem;
        border-top: 1px solid var(--line);
      }
      #say textarea {
        flex: 1;
        font: inherit;
        resize: none;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 0.45rem 0.75rem;
        background: rgba(var(--surface), 0.85);
        color: inherit;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      #say textarea:focus {
        border-color: rgba(var(--hl), 0.6);
        box-shadow: 0 0 0 4px rgba(var(--hl), 0.15);
      }
      #attach {
        display: grid;
        place-items: center;
        width: 30px;
        height: 38px;
        color: var(--muted);
        cursor: pointer;
      }
      #attach:hover,
      #attach:has(:focus-visible),
      #say.drop #attach {
        color: rgb(var(--hl));
      }
      #attach input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      #attach svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #say.drop textarea {
        border-color: rgb(var(--hl));
      }
      #send {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, rgb(var(--hl)), var(--hl-light));
        color: #fff;
        font-size: 15px;
      }

      /* a phone (phone.js, below WIDE): course and chat take turns on the
         whole screen, the bar at the bottom switches */
      #switch,
      #peek,
      #where {
        display: none;
      }
      body.phone {
        --switch-h: calc(68px + env(safe-area-inset-bottom));
      }
      body.phone #course {
        height: calc(100dvh - var(--switch-h));
      }
      body.phone[data-view='chat'] #course {
        visibility: hidden;
      }
      body.phone #chat {
        top: 0;
        left: 0;
        right: 0 !important;
        bottom: var(--switch-h) !important;
        border: 0;
        border-radius: 0;
        background: rgb(var(--surface));
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        box-shadow: none;
      }
      body.phone[data-view='course'] #chat {
        display: none;
      }
      body.phone #who {
        cursor: default;
      }
      body.phone #who::after,
      body.phone #chat > #grip,
      body.phone #dock {
        display: none;
      }
      body.phone #panel {
        width: auto !important;
        height: calc(100dvh - var(--switch-h) - var(--head, 2.75rem)) !important;
        min-width: 0;
        max-width: none;
        max-height: none;
      }
      body.phone #say textarea {
        font-size: 16px;
      }
      body.phone #switch {
        display: flex;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        gap: 4px;
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
        background: rgb(var(--surface));
        border-top: 1px solid var(--line);
      }
      #switch button {
        flex: 1;
        height: 48px;
        border: 0;
        border-radius: 12px;
        background: var(--soft);
        color: var(--muted);
        font: inherit;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
      }
      #switch button[aria-pressed='true'] {
        background: rgba(var(--hl), 0.14);
        color: var(--text);
        font-weight: 600;
      }
      #switch svg,
      #peek svg {
        width: 20px;
        height: 20px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #switch .num {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: var(--muted);
      }
      #unread {
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        box-sizing: border-box;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        display: inline-grid;
        place-items: center;
      }
      #unread[hidden] {
        display: none;
      }
      body.phone[data-view='course'] #peek:not([hidden]) {
        display: flex;
        position: fixed;
        left: 12px;
        right: 12px;
        /* above the navigation bar of the player */
        bottom: calc(var(--switch-h) + 48px);
        z-index: 3;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 0;
        border-radius: 18px;
        background: rgb(var(--surface));
        color: var(--text);
        box-shadow:
          0 10px 30px -8px rgba(var(--hl), 0.45),
          0 0 0 1px rgba(var(--hl), 0.18);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      #peek .face {
        flex: none;
        display: grid;
      }
      #peek .text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #peek .name {
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
      }
      #peek .line {
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #peek svg {
        color: var(--accent);
      }
      body.phone #where:not([hidden]) {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        margin: 8px 8px 0;
        padding: 0 12px;
        border: 0;
        border-radius: 12px;
        background: rgba(var(--hl), 0.1);
        color: var(--accent);
        font: inherit;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      #where .text {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #where > span:last-child {
        font-weight: 600;
        white-space: nowrap;
      }
      #where b {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <iframe id="course" title="LiaScript course" data-t-title="LiaScript course"></iframe>

    <details id="chat" open>
      <summary id="who">LiaAgent</summary>
      <div id="grip" title="Resize" data-t-title="Resize" aria-hidden="true"></div>
      <div id="panel">
        <!-- a phone: where the course is, and the way back to it (phone.js) -->
        <button id="where" type="button" hidden>
          <span class="text"></span><span data-t="To the course">To the course</span>
        </button>
        <div id="bar">
          <!-- the icons: the icon font of the player (chat.css), and four of
               Lucide (ISC license, lucide.dev) where it has none -->
          <select id="sessions" aria-label="Chat"></select>
          <div id="agents" role="radiogroup" aria-label="Agent" data-t-aria-label="Agent" hidden></div>
          <button
            id="new"
            class="tool"
            type="button"
            title="New chat"
            data-t-title="New chat"
            aria-label="New chat"
            data-t-aria-label="New chat"
          >
            <i class="icon" aria-hidden="true">&#xea10;</i>
          </button>
          <label id="autoread-box" class="tool" title="Read everything aloud" data-t-title="Read everything aloud" hidden>
            <input
              id="autoread"
              type="checkbox"
              aria-label="Read everything aloud"
              data-t-aria-label="Read everything aloud"
            />
            <i class="icon" aria-hidden="true"></i>
          </label>
          <button
            id="mute"
            class="tool"
            type="button"
            title="Cannot read aloud"
            data-t-title="Cannot read aloud"
            data-t-aria-label="Cannot read aloud"
            hidden
          >
            <i class="icon" aria-hidden="true">&#xea58;</i>
          </button>
          <button
            id="browse"
            class="tool"
            type="button"
            title="Open a web page"
            data-t-title="Open a web page"
            data-t-aria-label="Open a web page"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
              <path d="M2 12h20" />
            </svg>
          </button>
          <button id="files" class="tool" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
              />
            </svg>
          </button>
          <button id="home" class="tool" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
              <path
                d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
              />
            </svg>
          </button>
          <button
            id="phone"
            class="tool"
            type="button"
            aria-pressed="false"
            title="Open on a phone"
            data-t-title="Open on a phone"
            data-t-aria-label="Open on a phone"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
              <path d="M12 18h.01" />
            </svg>
          </button>
          <button id="dock" class="tool" type="button" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M15 3v18" />
            </svg>
          </button>
        </div>
        <form id="address" hidden>
          <input
            name="url"
            type="text"
            inputmode="url"
            aria-label="Web address"
            data-t-aria-label="Web address"
            placeholder="https://de.wikipedia.org/wiki/…"
          />
        </form>
        <div id="share" hidden>
          <div id="share-qr"></div>
          <div class="share-text">
            <p data-t="Scan it with the phone: course and chat open there, you continue where you are.">
              Scan it with the phone: course and chat open there, you continue where you are.
            </p>
            <p id="share-error" role="alert" hidden></p>
            <p class="share-actions">
              <button id="share-copy" type="button" data-t="Copy link">Copy link</button>
              <button id="share-stop" type="button" data-t="Stop sharing">Stop sharing</button>
            </p>
            <p class="share-note" data-t="Anyone with the link sees the course and the chat and can write to the assistant.">
              Anyone with the link sees the course and the chat and can write to the assistant.
            </p>
          </div>
        </div>
        <p
          id="mute-info"
          data-t="This browser cannot read aloud, it has no speech voices. Chrome and Edge bring their own, Firefox on Linux needs speech-dispatcher with a voice. The assistant can help to set it up."
          hidden
        ></p>
        <div id="log" role="log" aria-live="polite"></div>
        <div id="stage">
          <span id="bot"></span>
          <div class="lines">
            <div id="status" role="status" hidden></div>
            <div id="hint" role="status" hidden></div>
          </div>
          <button id="jump" type="button" hidden></button>
        </div>
        <form id="say">
          <label id="attach" title="Attach a file" data-t-title="Attach a file">
            <input type="file" multiple aria-label="Attach a file" data-t-aria-label="Attach a file" />
            <!-- Lucide paperclip -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551" />
            </svg>
          </label>
          <textarea
            name="text"
            rows="2"
            required
            aria-label="Message to the AI"
            data-t-aria-label="Message to the AI"
            placeholder="Ask the AI about this course …"
            data-t-placeholder="Ask the AI about this course …"
          ></textarea>
          <button id="send" title="Send" data-t-title="Send" aria-label="Send" data-t-aria-label="Send">
            <i class="icon" aria-hidden="true">&#xea52;</i>
          </button>
        </form>
      </div>
    </details>

    <!-- a phone: the newest message over the course, and the bar that
         switches between course and chat (phone.js); icons of Lucide -->
    <button id="peek" type="button" hidden aria-label="New message, open the chat" data-t-aria-label="New message, open the chat">
      <span class="face"></span><span class="text"><span class="name"></span><span class="line"></span></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
    </button>
    <nav id="switch" aria-label="View" data-t-aria-label="View">
      <button id="to-course" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z" /></svg>
        <span data-t="Course">Course</span><span id="to-slide" class="num"></span>
      </button>
      <button id="to-chat" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z" /></svg>
        <span>Chat</span><span id="unread" hidden></span>
      </button>
    </nav>

    <!-- the messages: LiaScript, served from node_modules/@liascript/chat -->
    <script src="lia-chat/element.js"></script>
    <!-- the teacher personas: DiceBear portraits, built by npm run build -->
    <script src="teachers.js"></script>
    <script src="avatar.js"></script>
    <script src="activity.js"></script>
    <script src="chat.js"></script>
    <!-- course and chat take turns on a phone -->
    <script src="phone.js"></script>
  </body>
</html>
