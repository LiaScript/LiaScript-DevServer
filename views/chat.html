<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The chat shows what an AI writes after reading course text nobody vetted.
      So: no inline scripts, no remote images (a Markdown image could carry
      data out in its URL), no connections but to this server.
      style-src needs unsafe-inline for the diagrams mermaid renders.
      This policy covers the chat only, the course in the iframe has its own.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>LiaScript</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        color-scheme: light dark;
        font: 15px/1.45 system-ui, sans-serif;
      }
      #course {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #chat {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 1;
        background: Canvas;
        color: CanvasText;
        border: 1px solid GrayText;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgb(0 0 0 / 0.3);
      }
      #chat > summary {
        padding: 0.5rem 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
      #panel {
        display: flex;
        flex-direction: column;
        width: min(26rem, calc(100vw - 2rem - 2px));
        height: min(34rem, calc(100vh - 5rem));
        border-top: 1px solid GrayText;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .msg {
        max-width: 92%;
        padding: 0.5rem 0.75rem;
        border-radius: 10px;
        overflow-wrap: anywhere;
      }
      .me {
        align-self: flex-end;
        white-space: pre-wrap;
        background: Highlight;
        color: HighlightText;
      }
      .ai {
        align-self: flex-start;
        background: color-mix(in srgb, CanvasText 8%, Canvas);
      }
      .failed {
        outline: 2px solid red;
      }
      .ai > div > :first-child {
        margin-top: 0;
      }
      .ai > div > :last-child {
        margin-bottom: 0;
      }
      .ai pre {
        overflow-x: auto;
        padding: 0.5rem;
        background: color-mix(in srgb, CanvasText 12%, Canvas);
        border-radius: 6px;
      }
      .ai img,
      .ai svg {
        max-width: 100%;
        height: auto;
      }
      .ai table {
        border-collapse: collapse;
      }
      .ai th,
      .ai td {
        border: 1px solid GrayText;
        padding: 0.2rem 0.5rem;
      }
      .ai form {
        margin-top: 0.6rem;
        display: grid;
        gap: 0.5rem;
      }
      .ai fieldset {
        margin: 0;
        padding: 0.4rem 0.6rem;
        border: 1px solid GrayText;
        border-radius: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem 0.9rem;
      }
      .ai fieldset.buttons {
        border: 0;
        padding: 0;
      }
      button {
        font: inherit;
        padding: 0.35rem 0.8rem;
        border-radius: 8px;
        border: 1px solid GrayText;
        cursor: pointer;
      }
      button.chosen {
        background: Highlight;
        color: HighlightText;
      }
      #say {
        display: flex;
        gap: 0.5rem;
        padding: 0.6rem;
        border-top: 1px solid GrayText;
      }
      #say textarea {
        flex: 1;
        font: inherit;
        resize: none;
        border-radius: 8px;
        padding: 0.4rem 0.5rem;
      }
    </style>
  </head>
  <body>
    <iframe id="course" title="LiaScript course"></iframe>

    <details id="chat" open>
      <summary>Chat</summary>
      <div id="panel">
        <div id="log" role="log" aria-live="polite"></div>
        <form id="say">
          <textarea
            name="text"
            rows="2"
            required
            aria-label="Message to the AI"
            placeholder="Ask the AI about this course …"
          ></textarea>
          <button>Send</button>
        </form>
      </div>
    </details>

    <!--
      ponytail: from a CDN, pinned and integrity-checked. Offline the chat
      falls back to plain text and shows no diagrams. Vendor the files into
      views/ if offline use matters (mermaid alone is 5 MB per package/binary).
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js"
      integrity="sha256-sUcnSpzifRcnZYcWfklIPXGfaJPuyjo2Z6WXl2YdNVY="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"
      integrity="sha256-8mOwU2ngUPoXXU7LnJNY60JTYC1RApet+zHfSLLxxNU="
      crossorigin="anonymous"
    ></script>
    <script src="chat.js"></script>
  </body>
</html>
