on:
  push:
    tags:
      - '*'
    branches:
      - mcp

name: Create Release

permissions:
  contents: write

jobs:
  build:
    # the branch mcp builds only in the private LiaScript/DevServer, never as a public release
    if: github.ref_type == 'tag' || github.repository == 'LiaScript/DevServer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Building Package
        run: |
          npm install -g @yao-pkg/pkg@6.23.0

          npm install
          npm run build
          npm run release
      # ponytail: a push of the branch replaces the assets of the release of its version, the tag stays on the
      # first commit of that version; bump package.json for a release of its own
      - name: Version
        id: version
        run: echo "tag=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' }}
          body: |
            Download your OS specific binary from below
          files: |
            ./release/linux/liascript-devserver-linux
            ./release/macos/liascript-devserver-macos
            ./release/windows/liascript-devserver.exe
