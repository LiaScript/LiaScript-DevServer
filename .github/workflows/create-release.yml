on:
  push:
    tags:
      - '*'
    branches:
      - mcp

name: Create Release

permissions:
  contents: write

jobs:
  build:
    # the branch mcp builds only in the private LiaScript/DevServer, never as a public release
    if: github.ref_type == 'tag' || github.repository == 'LiaScript/DevServer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      # one repository, three packages: @liascript/devserver is tagged 1.4.0--2.7.0, @liascript/mcp mcp-1.5.0--2.7.0
      - name: Version
        id: version
        run: |
          name=$(node -p "require('./package.json').name.split('/')[1]")
          version=$(node -p "require('./package.json').version")
          if [ "$name" = devserver ]; then tag="$version"; else tag="$name-$version"; fi
          if [ "${{ github.ref_type }}" = tag ] && [ "${{ github.ref_name }}" != "$tag" ]; then
            echo "::error::the tag ${{ github.ref_name }} does not match package.json, expected $tag"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Building Package
        run: |
          npm install -g @yao-pkg/pkg@6.23.0

          npm install
          npm run build
          npm run release
      # ponytail: a push of the branch replaces the assets of the release of its version, the tag stays on the
      # first commit of that version; bump package.json for a release of its own
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' }}
          # latest stays the plain devserver of main
          make_latest: ${{ github.ref_type == 'tag' && steps.version.outputs.name == 'devserver' }}
          body: |
            Download your OS specific binary from below
          files: |
            ./release/linux/liascript-${{ steps.version.outputs.name }}-linux
            ./release/macos/liascript-${{ steps.version.outputs.name }}-macos
            ./release/windows/liascript-${{ steps.version.outputs.name }}.exe
