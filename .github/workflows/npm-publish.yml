on:
  push:
    tags:
      - '*'
  workflow_dispatch:

name: Publish on NPM

jobs:
  build:
    # only the public repo publishes, the private LiaScript/DevServer builds release assets alone
    if: github.repository == 'LiaScript/LiaScript-DevServer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Node.js dependencies
        run: '[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true'

      - name: Building Project
        run: npm run build

      - name: Configure npm
        run: |
          npm config set //registry.npmjs.org/:_authToken ${NODE_AUTH_TOKEN}
          npm config list
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_KEY }}

      # the dist-tag follows the version: 1.5.0-mcp.1--2.7.0 is @mcp, -lms. is @lms, else latest
      - name: Channel
        id: channel
        run: |
          case "$(node -p "require('./package.json').version")" in
            *-mcp.*) echo "tag=mcp" >> "$GITHUB_OUTPUT" ;;
            *-lms.*) echo "tag=lms" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish to npm
        run: npm publish --access public --tag ${{ steps.channel.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_KEY }}
