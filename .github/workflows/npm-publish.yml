on:
  push:
    tags:
      - '*'
  workflow_dispatch:

name: Publish on NPM

jobs:
  build:
    # only the public repo publishes, the private LiaScript/DevServer builds release assets alone
    if: github.repository == 'LiaScript/LiaScript-DevServer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Node.js dependencies
        run: '[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true'

      # one repository, three packages: the tag mcp-1.5.0--2.7.0 publishes @liascript/mcp of that commit
      - name: Match the tag
        if: github.ref_type == 'tag'
        run: |
          name=$(node -p "require('./package.json').name.split('/')[1]")
          version=$(node -p "require('./package.json').version")
          if [ "$name" = devserver ]; then tag="$version"; else tag="$name-$version"; fi
          if [ "${{ github.ref_name }}" != "$tag" ]; then
            echo "::error::the tag ${{ github.ref_name }} does not match package.json, expected $tag"
            exit 1
          fi

      - name: Building Project
        run: npm run build

      - name: Configure npm
        run: |
          npm config set //registry.npmjs.org/:_authToken ${NODE_AUTH_TOKEN}
          npm config list
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_KEY }}

      - name: Publish to npm
        run: npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_KEY }}
