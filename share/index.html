<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiaLMS</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #222; --warn-bg: #fff3cd; --warn-fg: #664d03; --warn-line: #ffda6a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1b; --fg: #ddd; --warn-bg: #332701; --warn-fg: #ffda6a; --warn-line: #997404; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
    /* a warning floating over the frame: a bar pushed the UI down, and the
       frame below stays usable (pointer-events) */
    #status { position: fixed; top: .75rem; left: 0; right: 0; z-index: 1; box-sizing: border-box; width: fit-content; max-width: calc(100% - 2rem); margin: 0 auto; padding: .5rem 1rem; border: 1px solid var(--warn-line); border-radius: .5rem; background: var(--warn-bg); color: var(--warn-fg); font: 15px/1.4 system-ui, sans-serif; box-shadow: 0 2px 8px #0004; pointer-events: none; }
    iframe { display: block; border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <p id="status">Connecting…</p>
  <script type="module" src="lia-share.js"></script>
</body>
</html>
